version: '3.8'

services:
  credit-risk-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neostat_credit_risk_platform
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-3.5-flash-lite}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-15}
      - RATE_LIMIT_RPD=${RATE_LIMIT_RPD:-500}
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./credit_risk.db:/app/credit_risk.db:ro
      - ./logs:/app/logs
    restart: unless-stopped
